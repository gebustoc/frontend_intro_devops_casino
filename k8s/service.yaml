apiVersion: v1
kind: Service
metadata:
  name: casino-frontend
  labels:
    app: casino-frontend
spec:
  # ClusterIP = solo accesible DENTRO del clúster.
  # Otros servicios lo alcanzan vía DNS interno: http://products-service:8001
  type: LoadBalancer
  selector:
    app: casino-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80        # puerto del Service (DNS interno)
      targetPort: 80  # puerto del contenedor